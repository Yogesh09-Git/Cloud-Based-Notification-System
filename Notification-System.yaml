AWSTemplateFormatVersion: '2010-09-09'
Description: Cloud-Based Notification System - API Gateway, Lambda, SQS and SNS

Parameters:
  NotificationEmail:
    Type: String
    Description: Email address that will receive notifications
    AllowedPattern: '^[^@]+@[^@]+\.[^@]+$'
    ConstraintDescription: Enter a valid email address.

Resources:

  NotificationTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: cloud-notification-topic

  NotificationSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      Protocol: email
      TopicArn: !Ref NotificationTopic
      Endpoint: !Ref NotificationEmail

  NotificationQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: cloud-notification-queue
      VisibilityTimeout: 60

  ReceiverLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: cloud-notification-receiver-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: SendToSQS
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                Resource: !GetAtt NotificationQueue.Arn

  ProcessorLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: cloud-notification-processor-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ReadSQSAndPublishSNS
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource: !GetAtt NotificationQueue.Arn
              - Effect: Allow
                Action:
                  - sns:Publish
                Resource: !Ref NotificationTopic

  ReceiverLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: cloud-notification-receiver
      Runtime: python3.12
      Handler: index.lambda_handler
      Role: !GetAtt ReceiverLambdaRole.Arn
      Timeout: 10
      Environment:
        Variables:
          QUEUE_URL: !Ref NotificationQueue
      Code:
        ZipFile: |
          import json
          import os
          import boto3

          sqs = boto3.client("sqs")
          queue_url = os.environ["QUEUE_URL"]

          def lambda_handler(event, context):
              try:
                  body = event.get("body", event)

                  if isinstance(body, str):
                      body = json.loads(body)

                  message = {
                      "name": body.get("name", "User"),
                      "message": body.get("message", "Hello from Cloud Notification System")
                  }

                  sqs.send_message(
                      QueueUrl=queue_url,
                      MessageBody=json.dumps(message)
                  )

                  return {
                      "statusCode": 200,
                      "headers": {"Content-Type": "application/json"},
                      "body": json.dumps({
                          "success": True,
                          "message": "Notification request accepted",
                          "data": message
                      })
                  }

              except Exception as e:
                  return {
                      "statusCode": 500,
                      "headers": {"Content-Type": "application/json"},
                      "body": json.dumps({
                          "success": False,
                          "error": str(e)
                      })
                  }

  ProcessorLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: cloud-notification-processor
      Runtime: python3.12
      Handler: index.lambda_handler
      Role: !GetAtt ProcessorLambdaRole.Arn
      Timeout: 30
      Environment:
        Variables:
          TOPIC_ARN: !Ref NotificationTopic
      Code:
        ZipFile: |
          import json
          import os
          import boto3

          sns = boto3.client("sns")
          topic_arn = os.environ["TOPIC_ARN"]

          def lambda_handler(event, context):
              for record in event.get("Records", []):
                  try:
                      data = json.loads(record["body"])
                      name = data.get("name", "User")
                      message = data.get("message", "Notification")

                      email_subject = "Cloud Notification System"

                      email_body = (
                          "Hello " + name + ",\n\n"
                          "You have received a notification:\n\n"
                          + message +
                          "\n\nRegards,\nCloud Notification System"
                      )

                      sns.publish(
                          TopicArn=topic_arn,
                          Subject=email_subject,
                          Message=email_body
                      )

                  except Exception as e:
                      print("Error:", str(e))
                      raise

              return {"statusCode": 200}

  ProcessorEventSource:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt NotificationQueue.Arn
      FunctionName: !Ref ProcessorLambda
      BatchSize: 1
      Enabled: true

  NotificationApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: cloud-notification-api
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins:
          - '*'
        AllowMethods:
          - POST
          - OPTIONS
        AllowHeaders:
          - content-type

  NotificationIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref NotificationApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt ReceiverLambda.Arn
      PayloadFormatVersion: '2.0'

  NotificationRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref NotificationApi
      RouteKey: POST /notify
      Target: !Sub integrations/${NotificationIntegration}

  NotificationStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref NotificationApi
      StageName: prod
      AutoDeploy: true

  ApiLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ReceiverLambda
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${NotificationApi}/*/*

Outputs:

  ApiEndpoint:
    Description: POST this URL with name and message
    Value: !Sub https://${NotificationApi}.execute-api.${AWS::Region}.amazonaws.com/prod/notify

  SNSTopicArn:
    Description: SNS Topic ARN
    Value: !Ref NotificationTopic

  SQSQueueUrl:
    Description: SQS Queue URL
    Value: !Ref NotificationQueue

  ReceiverLambdaName:
    Description: Receiver Lambda function
    Value: !Ref ReceiverLambda

  ProcessorLambdaName:
    Description: Processor Lambda function
    Value: !Ref ProcessorLambda
